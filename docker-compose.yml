version: '3.9'
services:
  app:
    build: .
    ports:
      - '4000:4000'
      - '5173:5173'
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/scripture_studio
      - JWT_SECRET=dev-secret
      - REFRESH_SECRET=refresh-secret
      - AI_API_KEY=demo
      - AI_PROVIDER_URL=https://example.com/llm
    depends_on:
      - db
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scripture_studio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
